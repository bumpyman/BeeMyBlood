// ============================================================
// FONCTION D'ANALYSE DES ENTRÉES UTILISATEUR
// ============================================================

const analyzeInput = (type, input) => {
  const lower = input.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const db = type === 'medication' ? medDB : diseaseDB;

  for (const [pattern, result] of Object.entries(db)) {
    const regex = new RegExp(pattern.normalize("NFD").replace(/[\u0300-\u036f]/g, ""), 'i');
    if (regex.test(lower)) {
      return result;
    }
  }

  return {
    ok: 'maybe',
    msg: '"' + input + '" nécessite une évaluation par le médecin du centre de transfusion. Contactez le 031 380 81 81.'
  };
};
// ============================================================

// ============================================================

const questions = [
  {
    id: 'age',
    q: "Quel âge avez-vous ?",
    type: 'number',
    help: "18-75 ans (18-60 pour le premier don)",
    check: function(v, a) {
      var n = parseInt(v);
      if (n < 18) return {ok: false, msg: "L'âge minimum pour donner son sang est de 18 ans."};
      if (n > 75) return {ok: false, msg: "L'âge maximum pour donner son sang est de 75 ans."};
      return {ok: true};
    }
  },
  {
    id: 'first',
    q: "Est-ce votre premier don de sang ?",
    type: 'bool',
    opts: ['Oui', 'Non'],
    check: function(v, a) {
      if (v === 'Oui' && parseInt(a.age) > 60) {
        return {ok: false, msg: "Pour un premier don, l'âge maximum est de 60 ans. Contactez votre centre pour une évaluation personnalisée."};
      }
      return {ok: true};
    }
  },
  {
    id: 'weight',
    q: "Quel est votre poids (en kg) ?",
    type: 'number',
    help: "Le poids minimum requis est de 50 kg",
    check: function(v) {
      if (parseInt(v) < 50) {
        return {
          ok: false,
          msg: "Le poids minimum de 50 kg est requis pour garantir votre sécurité lors du prélèvement.",

  {

        return {
          ok: false,
          msg: "Il est préférable de donner votre sang quand vous vous sentez en pleine forme. Revenez quand vous serez rétabli(e) !",

          msg: "Contre-indication temporaire de 2 semaines après guérison complète et fin des antibiotiques.",

    }

    opts: ['Oui', 'Non'],

    setChatIn('');
