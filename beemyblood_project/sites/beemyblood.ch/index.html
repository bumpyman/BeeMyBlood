  <meta name="description" content="Test d'éligibilité au don de sang, questionnaire médical validé, chatbot IA et informations sur le don de sang en Suisse selon les critères CRS.">
  <meta name="keywords" content="don de sang, Suisse, éligibilité, HUG, CHUV, Croix-rouge, Genève, transfusion, CRS, questionnaire médical">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 5 C75 5 90 30 90 55 C90 80 50 98 50 98 C50 98 10 80 10 55 C10 30 25 5 50 5 Z' fill='%23DC2626'/%3E%3C/svg%3E">

<body>
  <div id="root">
    <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;color:#dc2626">
      <svg width="60" height="60" viewBox="0 0 100 100" style="margin-bottom:20px">
        <path d="M50 5 C75 5 90 30 90 55 C90 80 50 98 50 98 C50 98 10 80 10 55 C10 30 25 5 50 5 Z" fill="#DC2626"/>
      </svg>
      🩸 Chargement de BeeMyBlood: DONOR - v1...
    </div>
  </div>
  
  <script>
(function(){
  const e = React.createElement;
  const useState = React.useState;

  // ==================== ICÔNES ====================
  const Icon = (p) => e('svg', {className:p.className, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:'2', strokeLinecap:'round', strokeLinejoin:'round'}, p.children);
  const CheckCircle = (p) => e(Icon, p, e('path',{d:'M22 11.08V12a10 10 0 1 1-5.93-9.14'}), e('polyline',{points:'22 4 12 14.01 9 11.01'}));
  const AlertCircle = (p) => e(Icon, p, e('circle',{cx:'12',cy:'12',r:'10'}), e('line',{x1:'12',x2:'12',y1:'8',y2:'12'}), e('line',{x1:'12',x2:'12.01',y1:'16',y2:'16'}));
  const ChevronRight = (p) => e(Icon, p, e('path',{d:'m9 18 6-6-6-6'}));
  const ChevronDown = (p) => e(Icon, p, e('path',{d:'m6 9 6 6 6-6'}));
  const ChevronUp = (p) => e(Icon, p, e('path',{d:'m18 15-6-6-6 6'}));
  const RotateCcw = (p) => e(Icon, p, e('path',{d:'M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8'}), e('path',{d:'M3 3v5h5'}));
  const MapPin = (p) => e(Icon, p, e('path',{d:'M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z'}), e('circle',{cx:'12',cy:'10',r:'3'}));
  const Clock = (p) => e(Icon, p, e('circle',{cx:'12',cy:'12',r:'10'}), e('polyline',{points:'12 6 12 12 16 14'}));
  const MessageCircle = (p) => e(Icon, p, e('path',{d:'m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z'}));
  const User = (p) => e(Icon, p, e('path',{d:'M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2'}), e('circle',{cx:'12',cy:'7',r:'4'}));
  const BookOpen = (p) => e(Icon, p, e('path',{d:'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'}), e('path',{d:'M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'}));
  const HelpCircle = (p) => e(Icon, p, e('circle',{cx:'12',cy:'12',r:'10'}), e('path',{d:'M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3'}), e('path',{d:'M12 17h.01'}));
  const Send = (p) => e(Icon, p, e('path',{d:'m22 2-7 20-4-9-9-4Z'}), e('path',{d:'M22 2 11 13'}));
  const Zap = (p) => e(Icon, p, e('polygon',{points:'13 2 3 14 12 14 11 22 21 10 12 10 13 2'}));
  const Info = (p) => e(Icon, p, e('circle',{cx:'12',cy:'12',r:'10'}), e('path',{d:'M12 16v-4'}), e('path',{d:'M12 8h.01'}));
  const Loader2 = (p) => e('svg', {className:(p.className||'')+' animate-spin', viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:'2'}, e('path',{d:'M21 12a9 9 0 1 1-6.219-8.56'}));

  // ==================== LOGO BEEMYBLOOD ====================
  const Logo = () => e('div', {className:'flex flex-col items-center mb-2'},
    e('svg', {className:'w-20 h-20', viewBox:'0 0 100 100', fill:'none'},
      e('path', {d:'M50 5 C75 5 90 30 90 55 C90 80 50 98 50 98 C50 98 10 80 10 55 C10 30 25 5 50 5 Z', fill:'none', stroke:'#DC2626', strokeWidth:'3'}),
      e('ellipse', {cx:'50', cy:'50', rx:'16', ry:'18', fill:'none', stroke:'#DC2626', strokeWidth:'2.5'}),
      e('circle', {cx:'50', cy:'35', r:'7', fill:'none', stroke:'#DC2626', strokeWidth:'2'}),
      e('path', {d:'M44 30 Q36 22 38 16', fill:'none', stroke:'#DC2626', strokeWidth:'2', strokeLinecap:'round'}),
      e('path', {d:'M56 30 Q64 22 62 16', fill:'none', stroke:'#DC2626', strokeWidth:'2', strokeLinecap:'round'}),
      e('circle', {cx:'45', cy:'35', r:'1.5', fill:'#DC2626'}),
      e('circle', {cx:'55', cy:'35', r:'1.5', fill:'#DC2626'}),
      e('path', {d:'M30 48 Q18 44 14 50 Q10 56 20 60 Q28 62 32 56', fill:'none', stroke:'#DC2626', strokeWidth:'2.5'}),
      e('path', {d:'M70 48 Q82 44 86 50 Q90 56 80 60 Q72 62 68 56', fill:'none', stroke:'#DC2626', strokeWidth:'2.5'}),
      e('line', {x1:'40', y1:'55', x2:'60', y2:'55', stroke:'#DC2626', strokeWidth:'2'}),
      e('line', {x1:'38', y1:'62', x2:'62', y2:'62', stroke:'#DC2626', strokeWidth:'2'}),
      e('line', {x1:'42', y1:'69', x2:'58', y2:'69', stroke:'#DC2626', strokeWidth:'2'})
    )
  );

// ===== FIN PARTIE 1 - SUITE PARTIE 2 =====
// ===== PARTIE 2 - APP PRINCIPALE + DONNÉES =====

  // ==================== COMPOSANT APP ====================
  function App() {
    const [view, setView] = useState('home');
    const [step, setStep] = useState(0);
    const [answers, setAnswers] = useState({});
    const [result, setResult] = useState(null);
    const [chatMsgs, setChatMsgs] = useState([{role:'bot', text:"Bonjour ! Je suis l'assistant BeeMyBlood. Posez-moi vos questions sur le don de sang, les critères d'éligibilité, les médicaments, les voyages, etc."}]);
    const [chatIn, setChatIn] = useState('');
    const [chatLoading, setChatLoading] = useState(false);
    const [faqOpen, setFaqOpen] = useState(null);
    const [detailInput, setDetailInput] = useState('');
    const [awaitingDetail, setAwaitingDetail] = useState(null);
    const [analyzing, setAnalyzing] = useState(false);
    const [qGE, setQGE] = useState({sexe:''});
    const [qGEStep, setQGEStep] = useState(0);
    const [showPDFPreview, setShowPDFPreview] = useState(false);

    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    // Parse markdown **bold**
    const parseMarkdown = (text) => {
      if (!text) return text;
      const parts = text.split(/(\*\*[^*]+\*\*)/g);
      return parts.map((part, i) => {
        if (part.startsWith('**') && part.endsWith('**')) {
          return e('strong', {key: i}, part.slice(2, -2));
        }
        return part;
      });
    };

    // ==================== CHAT HANDLER ====================
    const handleChat = async () => {
      if (!chatIn.trim() || chatLoading) return;
      const userMsg = chatIn.trim();
      setChatMsgs(prev => [...prev, {role:'user', text: userMsg}]);
      setChatIn('');
      setChatLoading(true);
      try {
        const response = await fetch("api.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userMsg })
        });
        const data = await response.json();
        if (data.error) {
          setChatMsgs(prev => [...prev, {role:'bot', text: "Erreur: " + data.error + ". Appelez le 031 380 81 81."}]);
        } else if (data.reply) {
          setChatMsgs(prev => [...prev, {role:'bot', text: data.reply}]);
        } else {
          setChatMsgs(prev => [...prev, {role:'bot', text: "Réponse inattendue. Veuillez réessayer."}]);
        }
      } catch (err) {
        console.error('Erreur chatbot:', err);
        setChatMsgs(prev => [...prev, {role:'bot', text: "Erreur de connexion au serveur. Contactez Transfusion CRS au 031 380 81 81."}]);
      }
      setChatLoading(false);
    };

    // ==================== BASES DE DONNÉES MÉDICAMENTS ====================
    const medDB = {
      'contraceptif|pilule|nuvaring': {ok:true, msg:"Les contraceptifs sont compatibles avec le don."},
      'levothyrox|euthyrox|thyroïde': {ok:true, msg:"Les hormones thyroïdiennes sont compatibles si vous êtes stabilisé(e)."},
      'antihypertenseur|lisinopril|amlodipine|ramipril': {ok:true, msg:"Compatible si tension contrôlée (<180/100 mmHg le jour du don)."},
      'oméprazole|pantoprazole|ipp|inexium': {ok:true, msg:"Les inhibiteurs de la pompe à protons sont compatibles."},
      'paracétamol|dafalgan|doliprane': {ok:true, msg:"Le paracétamol est compatible avec le don."},
      'antihistaminique|cétirizine|loratadine|aerius': {ok:true, msg:"Les antihistaminiques sont compatibles."},
      'metformine|glucophage': {ok:'maybe', msg:"Compatible si diabète type 2 bien contrôlé, sans lésions organiques et sans insuline."},
      'aspirine|aspégic|kardégic': {ok:'delay', wait:'5 jours', msg:"Aspirine: contre-indication temporaire de 5 jours pour don de plaquettes. Don de sang total possible."},
      'ibuprofène|advil|nurofen|voltarène|diclofénac': {ok:'delay', wait:'24 heures', msg:"Anti-inflammatoires: contre-indication temporaire de 24 heures après la dernière prise."},
      'antibiotique|amoxicilline|augmentin|ciproxine': {ok:'delay', wait:'2 semaines', msg:"Antibiotiques: contre-indication temporaire de 2 semaines après fin du traitement et guérison complète."},
      'roaccutane|isotrétinoïne|curakne|tretinac': {ok:'delay', wait:'4 semaines', msg:"Isotrétinoïne: contre-indication temporaire de 4 semaines après la dernière prise."},
      'neotigason|acitrétine|acicutan': {ok:'delay', wait:'3 ans', msg:"Acitrétine: contre-indication temporaire de 3 ans après la dernière prise (tératogène)."},
      'finastéride|propecia|finacapil|proscar': {ok:'delay', wait:'4 semaines', msg:"Finastéride: contre-indication temporaire de 4 semaines après l'arrêt."},
      'dutastéride|avodart|duodart': {ok:'delay', wait:'6 mois', msg:"Dutastéride: contre-indication temporaire de 6 mois après l'arrêt."},
      'lithium': {ok:'delay', wait:'1 semaine', msg:"Lithium: contre-indication temporaire d'1 semaine après la dernière prise."},
      'méthotrexate': {ok:'delay', wait:'12 mois', msg:"Méthotrexate: contre-indication temporaire de 12 mois après l'arrêt."},
      'anticoagulant|sintrom|marcoumar|xarelto|eliquis|pradaxa': {ok:'delay', wait:'3 mois', msg:"Anticoagulants oraux: contre-indication temporaire de 3 mois après la dernière prise."},
      'héparine|clexane|fraxiparine': {ok:'delay', wait:'1 mois', msg:"Anticoagulants sous-cutanés: contre-indication temporaire d'1 mois après la fin du traitement."},
      'insuline|lantus|novorapid|humalog': {ok:false, msg:"Diabète insulino-dépendant: contre-indication définitive."},
      'immunosuppresseur|ciclosporine|tacrolimus|cellcept': {ok:false, msg:"Immunosuppresseurs: contre-indication définitive."},
      'chimiothérapie': {ok:false, msg:"Chimiothérapie: contre-indication. Voir critère Cancer (5 ans après rémission)."},
    };

    // ==================== BASES DE DONNÉES MALADIES ====================
    const diseaseDB = {
      'hypertension|tension': {ok:'maybe', msg:"Hypertension: compatible si contrôlée (<180/100 mmHg le jour du don)."},
      'diabète type 2|diabète sans insuline': {ok:'maybe', msg:"Diabète type 2: compatible si bien contrôlé, sans insuline et sans lésions organiques."},
      'diabète type 1|diabète insuline': {ok:false, msg:"Diabète insulino-dépendant: contre-indication définitive."},
      'hypothyroïdie|hashimoto': {ok:true, msg:"Hypothyroïdie: compatible si stabilisée par traitement de substitution."},
      'hyperthyroïdie|basedow': {ok:'maybe', msg:"Hyperthyroïdie: contre-indication temporaire de 6 mois après thyroïdectomie ou iode radioactif."},
      'asthme léger|asthme': {ok:'maybe', msg:"Asthme: compatible si asymptomatique avec inhalateurs. Contre-indication si crises fréquentes."},
      'allergie|rhume des foins': {ok:true, msg:"Allergies: compatibles si symptômes légers."},
      'dépression': {ok:true, msg:"Dépression: compatible si situation stable et traitement par comprimés."},
      'épilepsie': {ok:'maybe', msg:"Épilepsie: évaluation possible si >3 ans sans crise et sans traitement."},
      'infarctus|angine de poitrine|angor|maladie coronarienne': {ok:false, msg:"Maladies coronariennes: contre-indication définitive."},
      'avc|accident vasculaire': {ok:false, msg:"AVC: contre-indication définitive."},
      'insuffisance cardiaque|pacemaker': {ok:false, msg:"Insuffisance cardiaque/Pacemaker: contre-indication définitive."},
      'vih|sida': {ok:false, msg:"VIH: contre-indication définitive."},
      'hépatite b': {ok:false, msg:"Hépatite B: contre-indication définitive."},
      'hépatite c': {ok:false, msg:"Hépatite C: contre-indication définitive."},
      'hépatite a': {ok:'delay', wait:'4 mois', msg:"Hépatite A: contre-indication temporaire de 4 mois après guérison."},
      'cancer|tumeur': {ok:'maybe', msg:"Cancer: contre-indication temporaire de 5 ans après dernier traitement si guérison complète."},
      'crohn|rectocolite|rch': {ok:false, msg:"Maladie de Crohn / Rectocolite: contre-indication définitive."},
      'sclérose en plaques': {ok:false, msg:"Sclérose en plaques: contre-indication définitive."},
      'lupus': {ok:false, msg:"Lupus érythémateux systémique: contre-indication définitive."},
      'psoriasis': {ok:'maybe', msg:"Psoriasis: compatible si lésion limitée, hors site de ponction, sans traitement systémique."},
    };

    // Fonction d'analyse
    const analyzeInput = (type, input) => {
      const lower = input.toLowerCase();
      const db = type === 'medication' ? medDB : diseaseDB;
      for (const [pattern, result] of Object.entries(db)) {
        if (new RegExp(pattern, 'i').test(lower)) return result;
      }
      return {ok:'maybe', msg: '"' + input + '" nécessite une évaluation par le médecin du centre de transfusion.'};
    };

// ===== FIN PARTIE 2 - SUITE PARTIE 3 =====
// ===== PARTIE 3 - QUESTIONS + FAQ + HANDLERS =====

    // ==================== QUESTIONS DU QUIZ ====================
    const questions = [
      {id:'age', q:"Quel âge avez-vous ?", type:'number', help:"18-75 ans (18-60 premier don)",
        check:(v,a)=>{ const n=parseInt(v); if(n<18) return {ok:false,msg:"Minimum 18 ans requis."}; if(n>75) return {ok:false,msg:"Maximum 75 ans."}; return {ok:true}; }},
      {id:'first', q:"Est-ce votre premier don ?", type:'bool', opts:['Oui','Non'],
        check:(v,a)=>{ if(v==='Oui'&&parseInt(a.age)>60) return {ok:false,msg:"Premier don: âge maximum 60 ans."}; return {ok:true}; }},
      {id:'weight', q:"Poids (kg) ?", type:'number', help:"Minimum 50 kg",
        check:(v)=>{ if(parseInt(v)<50) return {ok:false,msg:"Le poids minimum de 50 kg est requis pour garantir votre sécurité lors du prélèvement.",isWeight:true}; return {ok:true}; }},
      {id:'health', q:"Vous sentez-vous en bonne santé aujourd'hui ?", type:'bool', opts:['Oui','Non'],
        check:(v)=>{ if(v==='Non') return {ok:false,msg:"Il est préférable de donner quand vous vous sentez en pleine forme. Revenez quand vous serez rétabli(e).",temp:true,isSick:true}; return {ok:true}; }},
      {id:'fever', q:"Fièvre (>38°C), infection ou antibiotiques ces 2 dernières semaines ?", type:'bool', opts:['Oui','Non'],
        check:(v)=>{ if(v==='Oui') return {ok:false,msg:"Contre-indication temporaire de 2 semaines après guérison et fin des antibiotiques.",temp:true,wait:"2 semaines"}; return {ok:true}; }},
      {id:'lastdon', q:"Don de sang ces 3-4 derniers mois ?", type:'bool', opts:['Oui','Non'],
        skip:(a)=>a.first==='Oui',
        check:(v)=>{ if(v==='Oui') return {ok:false,msg:"Respectez l'intervalle: 3 mois (H) / 4 mois (F).",temp:true}; return {ok:true}; }},
      {id:'pregnant', q:"Grossesse ou accouchement ces 12 derniers mois ?", type:'bool', opts:['Oui','Non','Non concerné'],
        check:(v)=>{ if(v==='Oui') return {ok:false,msg:"Contre-indication temporaire de 12 mois après l'accouchement.",temp:true,wait:"12 mois"}; return {ok:true}; }},
      {id:'tattoo', q:"Tatouage, piercing ou maquillage permanent ces 4 derniers mois ?", type:'bool', opts:['Oui','Non'],
        check:(v)=>{ if(v==='Oui') return {ok:false,msg:"Contre-indication temporaire de 4 mois après tatouage/piercing.",temp:true,wait:"4 mois"}; return {ok:true}; }},
      {id:'dental', q:"Extraction dentaire ou chirurgie dentaire récente ?", type:'bool', opts:['Oui','Non'],
        check:(v)=>{ if(v==='Oui') return {ok:false,msg:"Extraction dentaire: contre-indication temporaire d'1 semaine. Détartrage: 24h. Chirurgie complexe: 2 semaines après antibiotiques.",temp:true,wait:"1-2 semaines"}; return {ok:true}; }},
      {id:'surgery', q:"Opération chirurgicale ces 12 derniers mois ?", type:'bool', opts:['Oui','Non'],
        check:(v)=>{ if(v==='Oui') return {ok:'maybe',msg:"Délai variable selon intervention: 1 mois (mineure) à 6-12 mois (majeure). Neurochirurgie avec ouverture de la dure-mère: contre-indication définitive."}; return {ok:true}; }},
      {id:'transf', q:"Avez-vous déjà reçu une transfusion sanguine ?", type:'bool', opts:['Oui','Non'],
        check:(v)=>{ if(v==='Oui') return {ok:false,msg:"🆕 FÉVRIER 2026: Transfusion après 1980 n'est plus une contre-indication définitive! Contre-indication temporaire de 4 mois après la transfusion.",temp:true,wait:"4 mois",isNew:true}; return {ok:true}; }},
      {id:'uk', q:"Séjour de 6 mois ou plus au Royaume-Uni entre 1980 et 1996 ?", type:'bool', opts:['Oui','Non'],
        check:(v)=>{ return {ok:true}; }},
      {id:'travel', q:"Voyage en zone tropicale ou à risque de paludisme ces 6 derniers mois ?", type:'bool', opts:['Oui','Non'], help:"Ex: Afrique subsaharienne, Asie du Sud-Est, Amérique centrale/Sud, Inde...",
        check:(v)=>{ if(v==='Oui') return {ok:'needDetail',detailType:'travel',prompt:"Quelle destination ?",placeholder:"Ex: Thaïlande, Kenya, Brésil..."}; return {ok:true}; }},
      {id:'meds', q:"Prenez-vous des médicaments régulièrement ?", type:'bool', opts:['Oui','Non'],
        check:(v)=>{ if(v==='Oui') return {ok:'needDetail',detailType:'medication',prompt:"Quel(s) médicament(s) ?",placeholder:"Ex: Levothyrox, Aspirine, Lisinopril..."}; return {ok:true}; }},
      {id:'disease', q:"Avez-vous une maladie chronique ?", type:'bool', opts:['Oui','Non'],
        check:(v)=>{ if(v==='Oui') return {ok:'needDetail',detailType:'disease',prompt:"Quelle maladie ?",placeholder:"Ex: Hypertension, diabète, asthme..."}; return {ok:true}; }},
    ];

    // ==================== FAQ ====================
    const faq = [
      {cat:"Préparation", qs:[
        {q:"Comment me préparer ?",a:"Dormez bien, mangez normalement, buvez 1.5L d'eau. Apportez une pièce d'identité. Évitez l'alcool la veille."},
        {q:"Puis-je donner à jeun ?",a:"Non, prenez un repas léger 2-3h avant. Ne pas être à jeun."},
        {q:"Durée totale ?",a:"Prélèvement: 10-15 min. Première visite complète: 45-60 min."}
      ]},
      {cat:"Pendant le don", qs:[
        {q:"Est-ce douloureux ?",a:"Petite piqûre à l'insertion de l'aiguille, puis indolore."},
        {q:"Quantité prélevée ?",a:"450-500 ml (environ 8% du volume sanguin total)."}
      ]},
      {cat:"Après le don", qs:[
        {q:"Précautions ?",a:"Repos 15-20 min + collation. Buvez 1.5-2L dans les 24h. Évitez efforts intenses 24h. Gardez pansement 4-5h."},
        {q:"Conduite ?",a:"OK après 30 min de repos. Avion: attendre 48h. Train/bus professionnel: 12h."},
        {q:"Quand redonner ?",a:"Hommes: 3 mois (max 4x/an). Femmes: 4 mois (max 3x/an)."}
      ]},
      {cat:"Nouveautés février 2026", qs:[
        {q:"Quels changements ?",a:"• Transfusion après 1980: plus de contre-indication définitive (CID), maintenant contre-indication temporaire (CIT) de 4 mois\n• Séjour UK 1980-96: plus de contre-indication\n• Neurochirurgie CH sans ouverture dure-mère: CIT 12 mois"},
        {q:"Séjour UK années 80-90 ?",a:"Plus de contre-indication depuis février 2026! Le risque de maladie de Creutzfeldt-Jakob (vMCJ) est jugé extrêmement faible."},
        {q:"Transfusion reçue ?",a:"CIT 4 mois seulement (avant: CID définitive si après 1980)."}
      ]}
    ];

    // ==================== HANDLERS ====================
    const handleAnswer = (v) => {
      const cur = questions[step];
      const newA = {...answers, [cur.id]:v};
      setAnswers(newA);
      const r = cur.check(v, newA);
      if (r.ok === 'needDetail') { setAwaitingDetail(r); return; }
      if (r.ok === false || r.ok === 'maybe') { setResult(r); return; }
      if (r.msg && r.isNew) { setResult({...r, ok:true}); return; }
      let nextStep = step + 1;
      while (nextStep < questions.length && questions[nextStep].skip && questions[nextStep].skip(newA)) { nextStep++; }
      if (nextStep < questions.length) setStep(nextStep);
      else setResult({ok:true, msg:"Vous semblez éligible au don de sang! 🎉"});
    };

    const handleDetailSubmit = () => {
      if (!detailInput.trim()) return;
      setAnalyzing(true);
      const analysis = analyzeInput(awaitingDetail.detailType, detailInput);
      setTimeout(() => {
        setAnalyzing(false);
        setAwaitingDetail(null);
        const detail = detailInput;
        setDetailInput('');
        if (analysis.ok === false || analysis.ok === 'delay') {
          setResult({ok:false, msg:analysis.msg, temp:!!analysis.wait, wait:analysis.wait, detail:detail});
