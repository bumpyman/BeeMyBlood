<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>BeeMyBlood™ — Se connecter</title>
<script>(function(){try{var r=document.documentElement,t=localStorage.getItem('bmb-taille'),c=localStorage.getItem('bmb-contraste'),a=localStorage.getItem('bmb-animations');if(t&&t!=='normale')r.setAttribute('data-taille',t);if(c==='renforce')r.setAttribute('data-contraste','renforce');if(a==='reduites')r.setAttribute('data-animations','reduites');}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* Reste volontairement sombre, cohérent avec la modale de connexion (acces.js) qui la remplace aussitôt. */
body{--couleur-fond:#0D0D14;--couleur-texte:#E8E6E3;--couleur-texte-secondaire:#ADADC0;--couleur-principale:#FF8A80;background:var(--couleur-fond);color:var(--couleur-texte);font-family:'DM Sans',sans-serif;min-height:100vh}
.fallback{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;color:var(--couleur-texte-secondaire);font-size:14px}
.fallback a{color:var(--couleur-principale)}
</style>
</head>
<body>
<div class="fallback" id="fallback">Chargement de la connexion… <br><br>Si rien ne s’affiche, <a href="../">retournez à l’accueil</a>.</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../acces.js" data-espace="connexion" data-racine="../" defer></script>
<script src="../preferences.js" defer></script>
</body>
</html>
